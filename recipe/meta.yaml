{% set name = "rdfpy" %}
{% set version = "2.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rdfpy-{{ version }}.tar.gz
  sha256: f295bb2ec523ab43494382d576b7ade026f68426ede81153357770e0c5c252ba

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - matplotlib-base
    - numpy
    - python >={{ python_min }}
    - scipy

test:
  imports:
    - rdfpy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/by256/rdfpy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'rdfpy is a Python library for fast computation of 2D and 3D radial distribution functions.'
  description: |
    rdfpy is a Python library for fast computation of 2D and 3D radial 
    distribution functions.
  doc_url: https://rdfpy.readthedocs.io/
  dev_url: https://github.com/by256/rdfpy

extra:
  recipe-maintainers:
    - jan-janssen
